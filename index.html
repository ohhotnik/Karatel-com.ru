<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KARATEL - Скачать АПК</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial;background:#ff6a00;color:#fff;text-align:center}
header{padding:20px;font-size:26px;font-weight:900;background:#e65c00}
.wrap{max-width:480px;margin:0 auto;padding:20px}
.logo{font-size:70px}
.card{background:#fff;color:#222;border-radius:20px;padding:20px;margin-top:15px}
.btn{display:block;background:#ff6a00;color:#fff;text-decoration:none;padding:16px;border-radius:15px;font-size:20px;font-weight:bold;margin-top:12px}
.btn2{background:#111}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin-top:8px;font-size:16px}
.user{background:#fff3eb;padding:10px;border-radius:10px;margin-top:8px;display:flex;justify-content:space-between;color:#222}
.badge{background:#ff6a00;color:#fff;padding:3px 8px;border-radius:20px;font-size:12px;font-weight:bold}
#chat{height:180px;overflow:auto;background:#111;color:#fff;padding:10px;border-radius:10px;text-align:left}
.msg{margin-bottom:8px}
</style>
</head>
<body>
<header>🥋 KARATEL-COM.RU</header>
<div class="wrap">
<div class="logo">🥋</div>
<h1>KARATEL</h1>
<p>Качай приложение и заходи к нам!</p>

<div class="card">
<h2>📱 Скачать АПК</h2>
<p>Нажми кнопку ниже, чтобы скачать приложение:</p>
<a class="btn" href="https://github.com/ohhotnik/Karatel-com.ru/releases/download/v1.0/karatel.apk">⬇️ СКАЧАТЬ АПК</a>
<a class="btn btn2" href="https://karatel-com.ru">🌐 Открыть сайт</a>
<p style="font-size:13px;color:#888">Если не качается — напиши Аксу!</p>
</div>

<div class="card">
<h2>Регистрация</h2>
<input id="name" placeholder="Твоё имя, например Акс">
<input id="pass" type="password" placeholder="Пароль">
<button class="btn" onclick="register()" style="border:none;cursor:pointer">Зарегистрироваться / Войти</button>
<p style="font-size:13px;color:#888">Первый — станет Разработчиком 👑</p>
</div>

<div class="card" id="mainCard" style="display:none">
<h2>Привет, <span id="myName"></span>! <span id="myRole"></span></h2>
<h3>Бойцы:</h3>
<div id="users"></div>
<h3>Чат:</h3>
<div id="chat"></div>
<input id="msgInput" placeholder="Написать...">
<button class="btn" onclick="sendMsg()" style="border:none;cursor:pointer">Отправить</button>
</div>

</div>
<script>
const DB="https://karatel-test-1806a-default-rtdb.firebaseio.com";
let me=null;
async function getUsers(){ let r=await fetch(DB+"/users.json"); return await r.json()||{}; }
async function register(){
  let name=document.getElementById('name').value.trim();
  let pass=document.getElementById('pass').value.trim();
  if(!name||!pass) return alert('Напиши имя и пароль!');
  let users=await getUsers(); let list=Object.values(users);
  let found=list.find(u=>u.name.toLowerCase()===name.toLowerCase());
  if(found){ if(found.pass!==pass) return alert('Пароль не тот!'); me=found; }
  else { let role=list.length===0?"Разработчик 👑":"Боец 🥋"; me={name,pass,role,time:Date.now()}; await fetch(DB+"/users.json",{method:"POST",body:JSON.stringify(me)}); }
  localStorage.setItem('karatel',JSON.stringify(me)); showMain();
}
function showMain(){ if(!me) return; document.getElementById('mainCard').style.display='block'; document.getElementById('myName').innerText=me.name; document.getElementById('myRole').innerText=me.role; loadAll(); }
async function loadAll(){
  let users=await getUsers(); let html=""; Object.values(users).forEach(u=>{ html+=`<div class="user"><span>${u.name}</span><span class="badge">${u.role}</span></div>`; });
  document.getElementById('users').innerHTML=html||"Пока никого";
  let r=await fetch(DB+"/chat.json"); let chat=await r.json()||{}; let cHtml=""; Object.values(chat).slice(-30).forEach(m=>{ cHtml+=`<div class="msg"><b>${m.name}:</b> ${m.text}</div>`; });
  let box=document.getElementById('chat'); box.innerHTML=cHtml||"Пока нет сообщений"; box.scrollTop=box.scrollHeight;
}
async function sendMsg(){ let t=document.getElementById('msgInput').value.trim(); if(!t) return; await fetch(DB+"/chat.json",{method:"POST",body:JSON.stringify({name:me.name,text:t,time:Date.now()})}); document.getElementById('msgInput').value=""; loadAll(); }
let saved=localStorage.getItem('karatel'); if(saved){ me=JSON.parse(saved); showMain(); }
setInterval(()=>{ if(me) loadAll(); },3000);
</script>
</body>
</html>
